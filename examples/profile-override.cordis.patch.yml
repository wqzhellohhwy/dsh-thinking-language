# 覆盖示例：把语言改成别的（**改你 profile 的文件，不要改插件仓库里的**）
#
# 目标文件：<DSH_HOME>/profiles/<你的 profile>/cordis.patch.yml
# 该层排在所有 bundle 层之后，同 id 条目按「完整替换语义」覆盖 bundle 里的那行。
#
# 下面四条按需取用，一次只留一条即可。

# ── 例 1：换成日文 ────────────────────────────────────────────────────────────
- id: thinking-language
  name: dsh-thinking-language
  config:
    language: ja

# ── 例 2：换成繁体中文，并把段排到最后（10200 之后） ─────────────────────────
# - id: thinking-language
#   name: dsh-thinking-language
#   config:
#     language: zh-TW
#     order: 10300

# ── 例 3：完全自定义措辞（text 给了就覆盖内置模板） ───────────────────────────
# - id: thinking-language
#   name: dsh-thinking-language
#   config:
#     text: >-
#       全程使用简体中文思考与作答。代码、标识符、路径、命令名与工具原始输出保持原样。

# ── 例 4：临时关掉（保留依赖，不注册段） ─────────────────────────────────────
# - id: thinking-language
#   name: dsh-thinking-language
#   config:
#     enabled: false
